# SonarQube Project Configuration
sonar.projectKey=GauravSahu2_high-assurance-api
sonar.projectName=High-Assurance API
sonar.projectVersion=2.0.0
sonar.organization=gauravsahu2

# Required by sonarqube-scan-action
sonar.host.url=https://sonarcloud.io

# Source & Test Paths
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12

# Coverage Reporting
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions (Generated files and infrastructure)
sonar.exclusions=src/generated/**, **/venv/**, **/node_modules/**, **/mutants/**, **/.trivycache/**
sonar.coverage.exclusions=tests/**

# Quality Gate Enforcement (FAANG Standard)
sonar.qualitygate.wait=true
sonar.qualitygate.failOnUnknownStatus=true

# Advanced Analysis
sonar.python.ruff.reportPaths=ruff-report.json
sonar.python.bandit.reportPaths=bandit-report.json
sonar.dependencyCheck.jsonReportPath=trivy-report.json
